<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Haushalt</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f7f7fa;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --accent:#5b5bd6;--accent2:#7c7cf0;--good:#16a34a;--bad:#dc2626;--warn:#d97706;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f5f5f7;--muted:#9a9aa1;--line:#38383a;
  --accent:#8b8bff;--accent2:#a5a5ff;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{padding-top:var(--safe-t)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
input[type=color]{padding:2px;height:42px;width:64px}
#view{padding:8px 16px calc(110px + var(--safe-b));max-width:720px;margin:0 auto}
h1{font-size:30px;margin:10px 4px 12px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 6px 8px;font-weight:600}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:650}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow>.ellip{display:block}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li.sub{padding-left:40px;background:var(--card2)}
.li.sub2{padding-left:56px;background:var(--card2);font-size:14px}
.chev{color:var(--muted);font-size:18px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:3px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;display:inline-block}
.btn.sec{background:var(--card2);color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{display:block;width:100%;margin-top:10px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px}
.seg button{flex:1;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;width:100%;text-align:left}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthnav button{font-size:24px;padding:4px 14px;color:var(--accent)}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap svg{width:132px;height:132px;flex:none}
.legend{flex:1;min-width:0;font-size:13px}
.legend .row{margin:3px 0}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars .stack{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden}
.bars .lbl{font-size:11px;color:var(--muted)}
.bars .b.cur .lbl{color:var(--text);font-weight:700}
/* Tabbar */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 8px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);z-index:10}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);width:64px;padding:4px 0}
#tabs button.on{color:var(--accent)}
#tabs svg{width:25px;height:25px}
#tabs .plus{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;justify-content:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
#tabs .plus svg{width:30px;height:30px}
/* Sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
#sheet.on{transform:none}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
#sheet .hd b{font-size:17px;text-align:center;flex:1}
#sheet .hd button{color:var(--accent);min-width:70px;text-align:left}
#sheet .hd button:last-child{text-align:right;font-weight:600}
#sheet .bd{overflow:auto;padding:4px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 5px}
.irow:first-child{border-top:0}
.irow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.irow select{grid-column:1/3;font-size:14px;padding:7px 10px}
.irow .x{color:var(--bad);font-size:20px;height:34px}
.irow input.amt{text-align:right}
.irow.uns select{border-color:var(--warn)}
.opt{display:flex;gap:12px;align-items:center;padding:16px;background:var(--card);border-radius:16px;margin-bottom:10px;width:100%;text-align:left;box-shadow:var(--shadow)}
.opt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--card2);flex:none}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.syncdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:6px}
.syncdot.ok{background:var(--good)}.syncdot.err{background:var(--bad)}.syncdot.busy{background:var(--warn)}
code{font-size:12px;word-break:break-all;background:var(--card2);padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<main id="view"></main>

<nav id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Übersicht</button>
  <button data-tab="receipts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Belege</button>
  <button data-tab="add" class="plus" aria-label="Neu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>Fixkosten</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Mehr</button>
</nav>

<div id="ov"></div>
<section id="sheet" role="dialog" aria-modal="true"></section>
<div id="toast" role="status" aria-live="polite"></div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="picIn" accept="image/*" multiple hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
